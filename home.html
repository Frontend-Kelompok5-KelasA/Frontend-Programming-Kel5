<!DOCTYPE html>
<html>
    <head>
        <title>Home</title>
        <!--viewport= area tampilan website yang diliat browser-->
        <!--width=device-width= lebar halaman website sama walaupun beda perangkat-->
        <!--initial-scale=1.0=zoom saat pertama kali website dibuka-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

        <script type="module" src="scripts/panel.js" defer></script>
    </head>
    <body>
        <!--Tempat untuk melakukan penyambungan rangkaian-->
        <div id="canvas">
            <div class="content">
                <h2>Simulasi Rangkaian Listrik Seri</h2>
                
                <!--Panel untuk komponen-->
                <div class="panel">
                    <div class="panel-items">
                        <div class="item">
                            <img src="assets/battery.png" class="item-img" data-type="battery">
                            <div class="left-pointer"></div>
                            <div class="right-pointer"></div>
                            <span class="item-text">Battery</span>
                        </div>

                        <div class="item">
                            <img src="assets/light_off.png" class="item-img" data-type="bulb">
                            <div class="left-pointer"></div>
                            <div class="right-pointer"></div>
                            <span class="item-text">Light Bulb</span>
                        </div>

                        <div class="item">
                            <img src="assets/resistor.png" class="item-img" data-type="resistor">
                            <div class="left-pointer"></div>
                            <div class="right-pointer"></div>
                            <span class="item-text">Resistor</span>
                        </div>

                        <div class="item">
                            <img src="assets/switch_off.png" class="item-img" data-type="switch">
                            <div class="left-pointer"></div>
                            <div class="right-pointer"></div>
                            <span class="item-text">Switch</span>
                        </div>
                    </div>
                </div>

                <!--Tool untuk wire dan rotation-->
                <div class="tool">
                    <div class="tools">
                        <div class="item">
                            <img src="assets/wire.png" class="item-img" data-type="wire">
                            <span class="item-text">Wire</span>
                        </div>

                        <div class="item">
                            <img src="assets/rotate.png" class="item-img" data-type="rotate">
                            <span class="item-text">Rotate</span>
                        </div>

                        <div class="item">
                            <img src="assets/trash.png" class="item-img" data-type="delete">
                            <span class="item-text">Delete</span>
                        </div>
                    </div>
                </div>
                <button id="keluar">Keluar</button>
                <script type="module" src="script.js"></script>
            </div>
        </div>
    </body>
</html>

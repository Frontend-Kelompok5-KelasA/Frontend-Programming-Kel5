<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>Kuliner Nusantara di Jakarta</title>

        <!--BOOTSTRAP CDN-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        
        <link rel="stylesheet" href="style.css">

        <!--EMBED FONT-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Gabarito:wght@400..900&display=swap" rel="stylesheet">
        
        <script src="script.js" defer></script>
    </head>

    <body>
        <nav>
            <button class="nav-buttons" id="nav-hamburger">
                <img class="nav-icon" src="images/hamburger.png" alt="menu">
            </button>

            <div id="nav-links">
                <a href="#home" id="home">Home</a>
                <a href="#menu" id="">Menu</a>
                <a href="#reviews" id="">Reviews</a>
                <a href="#blog" id="">Blog</a>
                <a href="#contact" id="">Contact</a>
            </div>
        </nav>
        
        <div class="search-filter-section">
            <input type="search" id="search-rest" placeholder="Search...">
            <button id="open-m-filter">Filter
                <img src="images/filter.png">
            </button>

            <div id="modal">
                <div class="modal-inner">
                    <h1>Filter Your Restaurant!</h1>
                    <hr>
                    <h2>Asal Daerah Nusantara</h2>
                    <div id="asal-daerah-filter"></div>
                    <hr>
                    <h2>Jenis Makanan</h2>
                    <div id="jenis-filter"></div>
                    <hr>
                    <h2>Price Range</h2>
                    <div id="price-filter"></div>
                    <hr>
                    <button id="close-filter">Done</button>
                </div>
            </div>

        </div>
        <hr>
        <div class="list-resto">
            <h2>Explore Some Restaurant</h2>
            <div class="food-list d-flex flex-wrap justify-content-center gap-4" id="food-list">
                <!-- Card di-generate otomatis dari data.json lewat script.js -->
            </div>
        </div>

        <div id="detail-modal">
            <div class="modal-inner detail-inner">
                <button id="close-detail" aria-label="Tutup">&times;</button>
                <div id="detail-content">
                    <!-- Modal detail restoran diisi di script.js)-->
                </div>
                </div>
        </div>
    </body>
</html>
